name: Pull Request CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs when a new push is made
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job in this workflow. Jobs here only read
# the repo and run npm scripts, so no write scopes are needed; a job that ever
# needs more should opt in with its own permissions block.
permissions:
  contents: read

jobs:
  # Check code formatting
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

  # Check TypeScript types
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run type-check

  # Lint the code
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Run unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Build the application
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: ./build
          retention-days: 1

  # Test deployment (verify build can be served)
  test-deployment:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Installs the pinned `serve` from the lockfile. Without this the serve
      # step below had to fetch it from the registry inside its own 30s
      # readiness budget - a download that measured ~24s on a good run and
      # timed out the job on a slow one.
      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: ./build

      - name: Verify build contents
        run: |
          echo "Build directory contents:"
          ls -la ./build/

          # Check if index.html exists
          if [ ! -f "./build/index.html" ]; then
            echo "❌ index.html not found in build directory"
            exit 1
          fi

          echo "✅ Build files verified"

      - name: Test static file serving
        run: |
          # Start serve in background and capture output
          echo "Starting server..."
          ./node_modules/.bin/serve ./build -l 8080 > server.log 2>&1 &
          SERVER_PID=$!

          echo "Server PID: $SERVER_PID"

          # Wait for server to start with better detection
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/ > /dev/null 2>&1; then
              echo "✅ Server is responding after ${i} seconds"
              break
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to start within 30 seconds"
              echo "Server log:"
              cat server.log
              echo "Process status:"
              ps aux | grep -E "(serve|node)" || echo "No serve/node processes found"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            
            echo "Attempt $i/30: Server not ready yet, waiting..."
            sleep 1
          done

          # Test specific endpoints
          echo "Testing specific files..."

          # Test index.html
          if curl -s -f http://localhost:8080/index.html > /dev/null; then
            echo "✅ index.html accessible"
          else
            echo "❌ index.html not accessible"
            echo "Server log:"
            cat server.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Test root path
          if curl -s -f http://localhost:8080/ > /dev/null; then
            echo "✅ Root path accessible"
          else
            echo "❌ Root path not accessible"
            echo "Server log:"
            cat server.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "✅ All deployment tests passed"

          # Clean up
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

  # E2E render tests (verify page renders correctly after deployment)
  e2e-render:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: ./build

      - name: Run E2E render tests
        run: npm run test:e2e -- --grep "page rendering"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-render-results
          path: test-results/
          retention-days: 3

  # E2E interaction tests (verify user interactions work after deployment)
  e2e-interactions:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: ./build

      - name: Run E2E interaction tests
        run: npm run test:e2e -- --grep "user interactions"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-interaction-results
          path: test-results/
          retention-days: 3

  # Security audit
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Both audits are informational. Neither blocks the merge.
      #
      # This is a static export (output: 'export') with three production
      # dependencies, and dev-only tooling is never shipped. The real
      # gatekeeper for a bad dependency is the rest of this pipeline - the
      # E2E suites run against the built export and catch a bump that
      # actually breaks the app. Vulnerability reporting is Dependabot's
      # job, and its alerts cover the same graph without a network call in
      # the merge path.
      #
      # Blocking on `npm audit` made merges depend on the availability of
      # npm's advisories endpoint, which is not reliable. On 2026-09-04 it
      # returned 503 for hours: `npm ci` (which audits implicitly) stretched
      # from ~12s to over 4 minutes and the audit step hit its 300s timeout,
      # failing CI on two PRs that had nothing wrong with them. Every audit
      # failure this pipeline has produced has been that outage. With
      # low-risk updates now auto-merging on green CI, a false failure stops
      # being noise and starts being unattended busy work.
      - name: Audit production dependencies (informational)
        run: npm audit --audit-level moderate --omit=dev
        continue-on-error: true

      # Full-graph audit including dev deps. Keeps dev-tooling findings
      # visible in CI logs.
      - name: Audit dev dependencies (informational)
        run: npm audit --audit-level high
        continue-on-error: true

  # All checks must pass
  all-checks:
    runs-on: ubuntu-latest
    # Reads no repository content - only the results of the jobs it needs.
    permissions: {}
    needs:
      [
        format,
        type-check,
        lint,
        test,
        build,
        test-deployment,
        e2e-render,
        e2e-interactions,
        security,
      ]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.format.result }}" != "success" ]]; then
            echo "❌ Format check failed"
            exit 1
          fi
          if [[ "${{ needs.type-check.result }}" != "success" ]]; then
            echo "❌ Type check failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Linting failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [[ "${{ needs.test-deployment.result }}" != "success" ]]; then
            echo "❌ Deployment test failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-render.result }}" != "success" ]]; then
            echo "❌ E2E render tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-interactions.result }}" != "success" ]]; then
            echo "❌ E2E interaction tests failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ Security audit failed"
            exit 1
          fi
          echo "✅ All checks passed!"
