# Dependabot auto-merge
#
# Enables GitHub's native auto-merge on low-risk Dependabot PRs. GitHub then
# holds the PR until every required status check passes and merges it itself.
# There is no polling, no scheduled sweep and no merge logic here - the
# platform owns all of it.
#
# The safety net is branch protection, not this file: `all-checks` is a
# required status check, so nothing merges without the full pipeline green,
# including the E2E suites that exercise the built static export. That is the
# layer that catches a dependency bump breaking the app, which source-level
# unit tests cannot.
#
# `pull_request_target` is deliberate. Workflows triggered by Dependabot on a
# plain `pull_request` event get a read-only GITHUB_TOKEN, which cannot enable
# auto-merge. `pull_request_target` runs in the context of the base branch and
# so gets a writable token. The usual danger of that trigger is checking out
# and executing PR-controlled code with a privileged token - this job never
# checks anything out. It reads metadata and calls the API, nothing else.

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Both signals checked: the triggering actor and the PR author.
    if: >
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: meta
        # Pinned to an immutable SHA rather than the mutable v3 tag: this job
        # holds a token with contents:write, so a retagged upstream release
        # would inherit it. Dependabot keeps the SHA current via the
        # github-actions ecosystem in dependabot.yml - keep the trailing
        # version comment, that is how Dependabot reads the version.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      # Auto-merge policy:
      #   patch                  -> yes
      #   minor, dev dependency  -> yes
      #   minor, prod dependency -> manual
      #   major                  -> manual
      #   GitHub Actions, any    -> manual
      #
      # Actions updates stay manual at every level. A compromised action runs
      # inside CI with repo write access, and no amount of green CI would
      # surface that - it is the one update type where passing tests are not
      # evidence of safety. Two independent signals, so this cannot fail open
      # if the metadata output is ever empty: the ecosystem and Dependabot's
      # own branch prefix, which is intrinsic to the PR.
      #
      # Grouped PRs report the highest risk in the group (major > minor >
      # patch, production > development), so a mixed group is held to the
      # riskiest member.
      - name: Enable auto-merge for low-risk updates
        if: >
          !startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/') &&
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
          steps.meta.outputs.dependency-type == 'direct:development'))
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
