# Dependabot configuration
# Docs: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'daedalist'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore'
      include: 'scope'

    # ========================================
    # GROUPING - Reduce PR noise
    # ========================================
    # NOTE: Groups are explicitly scoped to dev dependencies to avoid
    # mixing dev and prod deps, which would make the whole group
    # require manual review (fetch-metadata returns "highest risk" type)
    groups:
      # Group all TypeScript type definitions together
      typescript-types:
        dependency-type: 'development'
        patterns:
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'

      # Group ESLint and related tooling
      eslint:
        dependency-type: 'development'
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
        update-types:
          - 'minor'
          - 'patch'

      # Group testing tools
      testing:
        dependency-type: 'development'
        patterns:
          - 'jest*'
          - '@jest/*'
          - '@testing-library/*'
        update-types:
          - 'minor'
          - 'patch'

      # Group Prettier and formatting
      formatting:
        dependency-type: 'development'
        patterns:
          - 'prettier*'
          - 'eslint-config-prettier'
          - 'eslint-plugin-prettier'
        update-types:
          - 'minor'
          - 'patch'

      # Group remaining dev dependency patches
      dev-patches:
        dependency-type: 'development'
        update-types:
          - 'patch'
        exclude-patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier*'
          - 'jest*'
          - 'typescript-eslint'

      # Production patches get their own group (auto-merged after cooling)
      prod-patches:
        dependency-type: 'production'
        update-types:
          - 'patch'

    # ========================================
    # EXCLUSIONS - Risky packages requiring manual review
    # ========================================
    ignore:
      # Major framework updates - always review manually
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

      # TypeScript major versions can have breaking changes
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

      # Node.js types should match your Node version
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # ========================================
  # GITHUB ACTIONS
  # ========================================
  # Required, not optional: dependabot/fetch-metadata is pinned to a commit
  # SHA in dependabot-auto-merge.yml, and a SHA pin never moves on its own.
  # Without this block the pin silently rots - the usual symptom is the action
  # declaring a Node runtime GitHub has since retired, which fails the job.
  # Dependabot rewrites both the SHA and its trailing version comment.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'daedalist'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'

    groups:
      # Patch bumps only. Actions report as production dependencies, so the
      # auto-merge gate treats a patch group as auto-mergeable after the
      # 48-hour cooling period, while minor and major updates arrive as
      # individual PRs that need a manual look.
      actions-patches:
        patterns:
          - '*'
        update-types:
          - 'patch'
